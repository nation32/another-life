<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>타인의 삶</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column. The day plays as webtoon panels (4:5) with captions, speech bubbles and a phone that slides up. Lanyard blue = the company, highlighter yellow = the real hourly wage. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface2:#F5F7FA; --ink:#17202A; --muted:#5A6672; --line:#D4DAE1;
  --badge:#2443C4; --badge-ink:#FFFFFF; --hl:#FFE14D; --hl-ink:#1B1B12;
  --good:#167A4C; --bad:#C23B2A; --bubble:#E6EAF0;
  --panel-line:#111418; --cap-bg:#FFFFFF; --cap-ink:#16181C;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-hand:"Gaegu","IBM Plex Sans KR",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--badge);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.note{font-size:12px;color:var(--muted)}
.demo-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;width:max-content}

/* ---------- panel (webtoon cut) ---------- */
.panel{position:relative;width:100%;aspect-ratio:4/5;max-height:62vh;margin:0 auto;border:3px solid var(--panel-line);background:#222;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.panel.tilt-a{clip-path:polygon(0 0,100% 1.2%,100% 100%,0 98.8%)}
.panel.tilt-b{clip-path:polygon(0 1.2%,100% 0,100% 98.8%,0 100%)}
.panel svg.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.panel img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.panel .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 14%;text-align:center;background:radial-gradient(120% 90% at 50% 30%,#3A4A6B,#141A26);color:#D5DDEC;font-size:13px}
.panel .ph b{font-family:var(--f-display);font-weight:400;font-size:22px;color:#fff}
.photo .ph-emoji{width:100%;height:100%;display:grid;place-items:center;font-size:40px;background:var(--surface2)}
.ai-tag{position:absolute;right:3%;top:2.5%;font-size:9px;font-weight:700;letter-spacing:.04em;color:#fff;background:rgba(10,12,16,.5);border-radius:6px;padding:1px 6px}
.panel .cam{transform-origin:50% 45%}
.cam-zoomin{animation:camZoomIn 10s ease-out forwards}
.cam-zoomout{animation:camZoomOut 10s ease-out forwards}
.cam-panr{animation:camPanR 12s ease-in-out forwards}
.cam-panl{animation:camPanL 12s ease-in-out forwards}
.cam-shake{animation:camShake .5s ease 2}
@keyframes camZoomIn{from{transform:scale(1)}to{transform:scale(1.09)}}
@keyframes camZoomOut{from{transform:scale(1.12)}to{transform:scale(1)}}
@keyframes camPanR{from{transform:scale(1.08) translateX(-10px)}to{transform:scale(1.08) translateX(10px)}}
@keyframes camPanL{from{transform:scale(1.08) translateX(10px)}to{transform:scale(1.08) translateX(-10px)}}
@keyframes camShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px) rotate(-.4deg)}75%{transform:translateX(4px) rotate(.4deg)}}
.panel-in{animation:panelIn .55s cubic-bezier(.2,.8,.2,1)}
.panel-out{animation:panelOut .32s ease-in forwards}
@keyframes panelIn{from{clip-path:inset(0 0 0 100%);transform:translateX(12px)}to{clip-path:inset(0 0 0 0);transform:none}}
@keyframes panelOut{to{transform:translateY(-18px);opacity:0}}
.panel.narr img.art,.panel.narr svg.art{filter:blur(10px) brightness(.3) saturate(.8);transition:filter .5s ease}
.panel.narr .cap,.panel.narr .say,.panel.narr .npc{left:8%;right:8%;top:50%;bottom:auto;transform:translateY(-50%);max-width:none;background:transparent;color:#fff;border:none;box-shadow:none;font-size:25px;line-height:1.4;text-align:center;padding:0;animation:narrIn .6s ease}
.panel.narr .say::after{display:none}
.panel.narr .npc .who{position:static;display:inline-block;margin-bottom:10px;background:#fff;color:#16181C}
.panel.narr .npc .tx{display:block}
.panel.narr .floaters{top:auto;bottom:12%}
@keyframes narrIn{from{opacity:0}to{opacity:1}}
@keyframes reactIn{from{opacity:0;clip-path:inset(0 0 0 100%)}to{opacity:1;clip-path:inset(0 0 0 0)}}
.chr{animation:breathe 4.2s ease-in-out infinite}
.chr.pop{animation:pop .35s ease, breathe 4.2s ease-in-out .35s infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5px)}}
@keyframes pop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-6px) scale(1.015)}100%{transform:none}}
.sway{animation:sway 3.6s ease-in-out infinite;transform-origin:50% 0}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.rock{animation:rock 2.4s ease-in-out infinite}
@keyframes rock{0%,100%{transform:translateY(0)}50%{transform:translateY(1.5px)}}
.streak{animation:streak 1.4s linear infinite}
.streak.s2{animation-duration:2.1s;animation-delay:-.7s}
.streak.s3{animation-duration:1.1s;animation-delay:-.3s}
@keyframes streak{from{transform:translateX(420px)}to{transform:translateX(-420px)}}
.twinkle{animation:twinkle 3s ease-in-out infinite}
.twinkle.t2{animation-delay:-1s}.twinkle.t3{animation-delay:-2s}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
.shakeit{animation:shakeit .25s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes shakeit{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.steam{animation:steam 2.6s ease-in-out infinite;opacity:.0}
.steam.d2{animation-delay:-1.3s}
@keyframes steam{0%{transform:translateY(8px);opacity:0}40%{opacity:.7}100%{transform:translateY(-16px);opacity:0}}
.blink{animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.spin{animation:spin 2.4s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.float{animation:floaty 2.2s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* overlays inside panel */
.ov{position:absolute;inset:0;pointer-events:none}
.cap{position:absolute;left:4%;top:4%;max-width:72%;background:var(--cap-bg);color:var(--cap-ink);border:2px solid #16181C;padding:9px 12px;font-family:var(--f-hand);font-size:19px;line-height:1.3;font-weight:700;box-shadow:3px 3px 0 rgba(0,0,0,.25);animation:capIn .25s ease}
.cap.time{font-family:var(--f-mono);font-size:13px;font-weight:600;padding:4px 8px;top:auto;bottom:4%;left:auto;right:4%;background:#16181C;color:#fff;border-color:#16181C;box-shadow:none}
@keyframes capIn{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.say{position:absolute;right:5%;top:6%;max-width:64%;background:#fff;color:#16181C;border:2px solid #16181C;border-radius:22px;padding:10px 15px;font-family:var(--f-hand);font-size:21px;line-height:1.25;font-weight:700;animation:sayIn .3s cubic-bezier(.2,1.4,.4,1)}
.say::after{content:"";position:absolute;left:22%;bottom:-13px;width:18px;height:16px;background:#fff;border-left:2px solid #16181C;border-bottom:2px solid #16181C;transform:skewX(-30deg) rotate(-10deg);border-bottom-left-radius:4px}
.say.left{right:auto;left:5%}
@keyframes sayIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.npc{position:absolute;left:4%;top:20%;max-width:74%;background:#fff;color:#16181C;border:2.5px solid #16181C;border-radius:16px;padding:16px 14px 10px;font-family:var(--f-hand);font-size:20px;line-height:1.25;font-weight:700;animation:sayIn .3s cubic-bezier(.2,1.4,.4,1);box-shadow:4px 4px 0 rgba(0,0,0,.3)}
.npc .who{position:absolute;top:-12px;left:10px;background:#16181C;color:#fff;font-family:var(--f-body);font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.02em}
.npc.shout{border-width:3px;transform:rotate(-1.5deg)}
.phone{position:absolute;left:50%;bottom:-2%;width:70%;height:64%;transform:translateX(-50%);background:#0E1116;border-radius:26px 26px 0 0;padding:10px 8px 0;box-shadow:0 -10px 30px rgba(0,0,0,.45);animation:phoneUp .4s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column}
.phone .scr{flex:1;background:#B9C9DA;border-radius:18px 18px 0 0;overflow:hidden;display:flex;flex-direction:column;font-family:var(--f-body)}
.phone .bar{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;padding:7px 12px;background:rgba(255,255,255,.55);color:#16181C}
.phone .list{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:8px 9px 12px;overflow:hidden}
.phone.kakao .scr{background:#B2C7D9}
.phone.work .scr{background:#E9EDF3}
.phone.blind .scr{background:#F2F3F5}
.phone.bank .scr{background:#EEF2F7}
.pm{display:flex;flex-direction:column;gap:2px;max-width:92%;animation:capIn .25s ease}
.pm .f{font-size:10px;font-weight:700;color:#3A4450}
.pm .b{background:#fff;color:#16181C;border-radius:4px 12px 12px 12px;padding:6px 9px;font-size:12.5px;line-height:1.4}
.pm .t{font-size:9px;color:#56606C;font-family:var(--f-mono)}
.pm.typing .b{color:#7A8490;font-style:italic}
.pp{background:#fff;border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;color:#16181C;animation:capIn .25s ease;border:1px solid #DDE1E6}
.pp .s{font-size:9.5px;color:#6A7480;font-weight:700}
.pp b{font-size:12.5px;line-height:1.35}
.pp .m{font-size:10px;color:#6A7480}
.pa{background:#fff;border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:1fr auto;gap:6px;color:#16181C;font-size:11.5px;animation:capIn .25s ease;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.pa .amt{font-family:var(--f-mono);font-weight:600;color:var(--bad)}
@keyframes phoneUp{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.banner{position:absolute;left:4%;right:4%;top:3%;background:rgba(250,251,253,.97);color:#16181C;border-radius:14px;padding:9px 12px;font-size:12.5px;display:flex;gap:9px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:bannerIn .35s cubic-bezier(.2,.9,.2,1)}
.banner .ic{width:26px;height:26px;border-radius:7px;background:var(--badge);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.banner b{display:block;font-size:11px;color:#56606C}
@keyframes bannerIn{from{transform:translateY(-140%)}to{transform:none}}
.sticky{position:absolute;right:5%;top:30%;width:52%;background:#FFE98A;color:#2A2410;padding:10px 12px 12px;font-family:var(--f-hand);font-size:17px;line-height:1.3;font-weight:700;transform:rotate(2.5deg);box-shadow:3px 4px 0 rgba(0,0,0,.22);animation:capIn .3s ease}
.sticky div{display:flex;gap:6px}
.filechip{position:absolute;left:6%;right:6%;bottom:6%;background:#fff;color:#16181C;border:2px solid #16181C;border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:11px;animation:capIn .3s ease}
.filechip span:first-child{background:#C23B2A;color:#fff;border-radius:4px;padding:1px 5px;font-weight:700}
.filechip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.stamp{position:absolute;left:5%;bottom:5%;max-width:80%;font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:8px;animation:stampIn .4s cubic-bezier(.2,1.6,.4,1);border:2px solid}
.stamp.perk{background:#E9F8F0;color:#0F5B38;border-color:#0F5B38}
.stamp.cost{background:#FDECEA;color:#8E2418;border-color:#8E2418}
@keyframes stampIn{from{transform:scale(1.6) rotate(-6deg);opacity:0}to{transform:rotate(-2deg);opacity:1}}
.floaters{position:absolute;left:0;right:0;top:38%;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0 10%}
.fl{font-family:var(--f-mono);font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px;background:#fff;border:2px solid #16181C;animation:floatUp 2.2s ease forwards}
.fl.up{color:#0F6B42}.fl.dn{color:#B02A1A}
@keyframes floatUp{0%{transform:translateY(16px) scale(.7);opacity:0}15%{transform:translateY(0) scale(1.05);opacity:1}75%{opacity:1}100%{transform:translateY(-36px);opacity:0}}
.tapnext{position:absolute;right:4%;bottom:3.5%;font-size:11px;font-weight:700;color:#fff;background:rgba(10,12,16,.65);border-radius:999px;padding:3px 10px;animation:blink 1.4s steps(2) infinite}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 8px;display:flex;flex-direction:column;gap:7px}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.clock{display:flex;align-items:baseline;gap:8px;min-width:0}
.clock .tm{font-family:var(--f-mono);font-size:24px;font-weight:600;line-height:1}
.clock .pl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wage{background:var(--hl);color:var(--hl-ink);border-radius:8px;padding:3px 10px;display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;flex:none}
.wage .k{font-size:10px;font-weight:700;letter-spacing:.04em}
.wage .v{font-family:var(--f-mono);font-weight:600;font-size:15px}
.wage.tick{animation:pop .5s ease}
.dayline{position:relative;height:3px;background:var(--line);border-radius:4px;overflow:hidden}
.dayline i{position:absolute;inset:0 auto 0 0;background:var(--badge);border-radius:4px;transition:width .6s ease}
.gauges{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.g{display:flex;flex-direction:column;gap:2px;min-width:0}
.g .lb{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
.g .lb b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.g .bar{height:5px;background:var(--line);border-radius:6px;overflow:hidden}
.g .bar i{display:block;height:100%;background:var(--ink);border-radius:6px;transition:width .6s ease}
.g.low .bar i{background:var(--bad)} .g.low .lb b{color:var(--bad)}
.g.hit{animation:pop .45s ease}

/* ---------- below panel ---------- */
.stage-meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stage-meta h2{font-size:22px}
.controls{display:flex;flex-direction:column;gap:12px;min-height:64px}
.thoughts{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.thought{position:relative;text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:26px;padding:12px 18px;font-family:var(--f-hand);font-size:20px;font-weight:700;line-height:1.25;width:100%;display:flex;flex-direction:column;gap:2px;animation:sayIn .3s cubic-bezier(.2,1.4,.4,1) both;transition:transform .12s ease,background .12s ease}
.thought:nth-child(2){animation-delay:.08s}.thought:nth-child(3){animation-delay:.16s}.thought:nth-child(4){animation-delay:.24s}
.thought::before,.thought::after{content:"";position:absolute;border:2px solid var(--ink);background:var(--surface);border-radius:50%}
.thought::before{width:12px;height:12px;left:26px;top:-16px}
.thought::after{width:7px;height:7px;left:18px;top:-26px}
.thought:hover{transform:translateY(-2px)}
.thought:active{transform:scale(.98)}
.thought .sub{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted)}
.thought .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:600}
.cta-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.next{background:var(--ink);color:var(--bg);border:none;border-radius:999px;padding:11px 22px;font-weight:700;margin-left:auto}
.skip{background:none;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;color:var(--muted)}
.react-note{font-size:13px;color:var(--muted)}

/* ---------- home / job ---------- */
.brand{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.brand h1{font-size:40px;line-height:1.08}
.brand h1 em{font-style:normal;background:linear-gradient(transparent 58%,var(--hl) 58%);color:inherit;padding:0 2px}
.brand p{color:var(--muted);max-width:36ch}
.hero .panel{max-height:46vh}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.section-title h2{font-size:22px}
.joblist{display:flex;flex-direction:column;gap:10px}
.job{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;width:100%}
.job .ic{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:26px;background:var(--surface2);border:1px solid var(--line)}
.job .nm{font-weight:700;font-size:16px}
.job .meta{font-size:13px;color:var(--muted)}
.job .go{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--badge);color:var(--badge-ink);white-space:nowrap}
.job.locked{background:transparent;border-style:dashed}
.job.locked .ic{filter:grayscale(1);opacity:.7}
.job.locked .go{background:transparent;color:var(--muted);border:1px solid var(--line)}
.job.playable{border:1.5px solid var(--badge)}
.tag-kind{font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:2px}
.votes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vote{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;min-width:0}
.vote .e{font-size:22px}
.vote[aria-pressed="true"]{border-color:var(--badge);box-shadow:inset 0 0 0 1px var(--badge)}
.vote .v{font-size:11px;color:var(--muted)}
.back{display:none!important}
.factlist .src{color:var(--muted);font-size:12px}
.back-unused{background:none;border:none;color:var(--muted);padding:4px 0;width:max-content;font-size:14px}
.idcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.idcard .lanyard{height:40px;background:var(--badge);display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:var(--badge-ink);font-weight:700;font-size:12px;letter-spacing:.06em}
.idcard .hole{width:44px;height:8px;border-radius:8px;background:var(--bg)}
.idcard .body{padding:16px;display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center}
.idcard .photo{width:84px;height:104px;border-radius:10px;background:#DCE3EC;border:1px solid var(--line);overflow:hidden}
.idcard .photo svg,.idcard .photo img{width:100%;height:100%;display:block;object-fit:cover;max-width:none}
.idcard .who{font-family:var(--f-display);font-size:26px;line-height:1.15}
.idcard .role{color:var(--muted);font-size:13px}
.facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.facts div{padding:10px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.facts div:nth-child(odd){border-right:1px solid var(--line)}

function cityLights(n, x0, x1, y0, y1, seed){
  let s = seed || 7, out = "";
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for(let i = 0; i < n; i++){
    const x = x0 + rnd()*(x1-x0), y = y0 + rnd()*(y1-y0);
    out += `<rect class="twinkle ${["","t2","t3"][i%3]}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="3" height="4" fill="#FFD98A"/>`;
  }
  return out;
}

function applyFx(fx){

    if(fx[k]){ const b = st.g[k]; st.g[k] = clamp(st.g[k] + fx[k], 0, 100); out.push([k, st.g[k]-b]); }

  if(fx.prog) st.prog = clamp(st.prog + fx.prog, 0, 150);

}
function spend(w){

  st.g.bank = clamp(st.g.bank - hit, 0, 100);

(async () => {
  try{
    if(!window.claude || typeof window.claude.use !== "function"){ rxState = "off"; paintRx(); return; }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user){ rxState = "off"; paintRx(); return; }
    RXUID = await user.id(); RXDB = db;
    const timer = setTimeout(() => { if(rxState === "loading"){ rxState = "slow"; paintRx(); } }, 10000);
    db.collection("reactions").onSnapshot(snap => {
      if(!snap.metadata.fromCache) clearTimeout(timer);
      RX = snap.docs.map(d => ({id:d.id, body:d.data() || {}}));
      rxState = "ready"; paintRx();
    }, () => { clearTimeout(timer); rxState = "off"; paintRx(); });
  }catch(e){ rxState = "off"; paintRx(); }
})();

  if(mine){

      const keys = KEY_SCENES[JOB_ID] || [];

        const pool = all.filter(r => r.choices && r.choices[sid] != null);
        const same = pool.filter(r => r.choices[sid] === myIdx).length;
        const pct = pool.length ? Math.round(same / pool.length * 100) : 0;

}
async function react(emo){
  if(rxWriting) return;
  const rec = {emo, ending:ending().name, choices:{...(st.choices || {})}, wage:Math.round(DAILY_PAY / Math.max(boundMin() / 60, 1)), at:Date.now()};
  store.set("rx:" + JOB_ID, rec);
  const shared = RXUID && RX.find(r => r.id === RXUID);
  if(shared) shared.body = {...shared.body, [JOB_ID]:rec}; else if(RXUID) RX = RX.concat([{id:RXUID, body:{[JOB_ID]:rec}}]);
  paintRx();
  if(!RXDB || !RXUID) return;
  rxWriting = true;
  try{
    const ref = RXDB.doc("reactions/" + RXUID);
    const cur = await ref.get();
    const body = cur.exists ? {...cur.data()} : {};
    body[JOB_ID] = rec;
    await ref.set(body);
  }catch(e){
    toast(e && e.code === "invalid_argument" ? "이 링크에서는 반응을 저장할 수 없어요. 내 기기에만 기록했어요." : "반응을 저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.");
  }finally{ rxWriting = false; }
}

/* ---------- 뒤로가기: 홈(0) ← 직업 상세(1) ← 체험·정산(2). 홈에서 뒤로가기를 누르면 미니앱이 닫힌다 ---------- */
const DEPTH = {home:0, job:1, play:2, end:2};
let ignorePop = 0;
function curDepth(){ return (history.state && history.state.aitDepth) || 0; }
function syncHistory(){
  const want = DEPTH[view.screen] || 0, have = curDepth();
  if(want > have){ for(let d = have + 1; d <= want; d++) history.pushState({aitDepth:d}, ""); }
  else if(want < have){ ignorePop++; history.go(want - have); }
}
window.addEventListener("popstate", () => {
  if(ignorePop > 0){ ignorePop--; return; }
  const d = curDepth();
  stopTyping();
  if(d <= 0){ view.screen = "home"; } else if(d === 1){ view.screen = "job"; }
  if(view.screen === "home") renderHome(); else if(view.screen === "job") renderJob();
  $modal.innerHTML = "";
  window.scrollTo(0, 0);
});

/* ---------- router ---------- */
function render(){
  stopTyping();
  syncHistory();
  if(view.screen === "home") renderHome();
  else if(view.screen === "job") renderJob();
  else if(view.screen === "play") beginScene();
  else renderEnd();
}
function boot(data){
  if(data && data.st && data.view && data.view.screen === "end"){ setJob(data.job || "daeri"); st = data.st; view = data.view; }
  render();
}
if(window.claude && window.claude.hot && window.claude.hot.snapshot){ try{ window.claude.hot.snapshot(() => ({st, view, job:JOB_ID})); }catch(e){} }
if(window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
